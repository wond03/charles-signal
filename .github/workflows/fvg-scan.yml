name: FVG Scan & Auto Trade

on:
  schedule:
    - cron: '*/5 * * * *'   # 每5分钟一次，5M 周期滞后 <= 1根K线（扫描+开单）
    - cron: '10 16 * * *'   # 每日统计：UTC 16:10 = 北京次日 00:10（统计自然日）
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 提交去重状态与交易记录回仓库

jobs:
  scan-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Debug OKX auth (balance probe)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, time, requests
          KEY = os.environ["OKX_API_KEY"]; SEC = os.environ["OKX_API_SECRET"]; PAS = os.environ["OKX_API_PASSPHRASE"]
          ts = time.strftime("%Y-%m-%dT%H:%M:%S.000Z", time.gmtime())
          path = "/api/v5/account/balance"
          msg = ts + "GET" + path + ""
          sig = base64.b64encode(hmac.new(SEC.encode(), msg.encode(), hashlib.sha256).digest()).decode()
          h = {"OK-ACCESS-KEY": KEY, "OK-ACCESS-SIGN": sig, "OK-ACCESS-TIMESTAMP": ts,
               "OK-ACCESS-PASSPHRASE": PAS, "Content-Type": "application/json", "x-simulated-trading": "1"}
          try:
              r = requests.get("https://www.okx.com"+path, headers=h, timeout=20)
              print("HTTP", r.status_code)
              print(r.text[:800])
          except Exception as e:
              print("ERR", type(e).__name__, e)
          PY

      - name: Scan FVG, push wecom & auto trade (OKX demo)
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          # 推送 FVG 信号
          python3 fvg_scanner.py --contract BTC_USDT --push || true
          python3 fvg_scanner.py --contract XAU_USDT --push || true
          # 自动开单（不限制信号/次数/周期，BTC 100x / XAU 50x，5U/单，RR 1:2）
          python3 trader.py --contract BTC_USDT --intervals 1h,15m,5m || true
          python3 trader.py --contract XAU_USDT --intervals 1h,15m,5m || true

      - name: Push new fills to personal (wecom-cli)
        env:
          WECOM_ENC_KEY: ${{ secrets.WECOM_ENC_KEY }}
          WECOM_CREDENTIALS: ${{ secrets.WECOM_CREDENTIALS }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          npm install -g @wecom/cli@1.3.2
          export PATH="$(npm prefix -g)/bin:$PATH"
          mkdir -p "$HOME/.config/wecom"
          echo "$WECOM_ENC_KEY" | base64 -d > "$HOME/.config/wecom/.encryption_key"
          echo "$WECOM_CREDENTIALS" | base64 -d > "$HOME/.config/wecom/credentials.enc"
          chmod 600 "$HOME/.config/wecom/.encryption_key" "$HOME/.config/wecom/credentials.enc"
          python3 trade_push.py || true

      - name: Persist state (dedup + trade records)
        run: |
          git config user.name "marvis-bot"
          git config user.email "marvis-bot@users.noreply.github.com"
          git add .fvg_pushed.json .fvg_traded.json .fills_pushed.json daily_trades_*.json 2>/dev/null || git add -A
          if git diff --cached --quiet; then
            echo "no state change, skip commit"
          else
            git commit -m "chore: update fvg/trade state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

  daily-report:
    runs-on: ubuntu-latest
    needs: [scan-trade]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '10 16 * * *')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Debug OKX orders endpoints
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          python3 - <<'PY'
          import json, requests, time, base64, hashlib, hmac, os
          KEY = os.environ["OKX_API_KEY"]; SEC = os.environ["OKX_API_SECRET"]; PAS = os.environ["OKX_API_PASSPHRASE"]
          ts = time.strftime("%Y-%m-%dT%H:%M:%S.000Z", time.gmtime())
          def req(path, params=None):
              qs = ("?" + requests.compat.urlencode(params)) if params else ""
              full = path + qs
              msg = ts + "GET" + full
              sign = base64.b64encode(hmac.new(SEC.encode(), msg.encode(), hashlib.sha256).digest()).decode()
              h = {"OK-ACCESS-KEY": KEY, "OK-ACCESS-SIGN": sign, "OK-ACCESS-TIMESTAMP": ts,
                   "OK-ACCESS-PASSPHRASE": PAS, "Content-Type": "application/json", "x-simulated-trading": "1"}
              r = requests.get("https://www.okx.com" + full, headers=h, timeout=20)
              try:
                  j = r.json(); print(path, params, "->", r.status_code, (j.get("code"), j.get("msg")), "n=", len(j.get("data", [])))
              except Exception:
                  print(path, params, "->", r.status_code, r.text[:150])
          req("/api/v5/trade/orders-history", {"instId": "BTC-USDT-SWAP"})
          req("/api/v5/trade/orders-history", {"instId": "BTC-USDT-SWAP", "ordType": "market"})
          req("/api/v5/trade/orders-history", {"instId": "BTC-USDT-SWAP", "state": "filled"})
          req("/api/v5/trade/orders-history", {"instId": "BTC-USDT-SWAP", "after": "", "before": "", "limit": "20"})
          req("/api/v5/trade/fills-history", {"instId": "BTC-USDT-SWAP"})
          req("/api/v5/trade/fills", {"instId": "BTC-USDT-SWAP"})
          req("/api/v5/trade/orders-algo-history", {"instId": "BTC-USDT-SWAP", "ordType": "oco"})
          req("/api/v5/account/positions", {"instId": "BTC-USDT-SWAP"})
          PY

      - name: Build & send daily report to personal (wecom-cli)
        env:
          WECOM_ENC_KEY: ${{ secrets.WECOM_ENC_KEY }}
          WECOM_CREDENTIALS: ${{ secrets.WECOM_CREDENTIALS }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: |
          # 统计北京时间昨日自然日，日报直发老板个人（wecom-cli），同时落盘供回溯
          npm install -g @wecom/cli@1.3.2
          export PATH="$(npm prefix -g)/bin:$PATH"
          mkdir -p "$HOME/.config/wecom"
          echo "$WECOM_ENC_KEY" | base64 -d > "$HOME/.config/wecom/.encryption_key"
          echo "$WECOM_CREDENTIALS" | base64 -d > "$HOME/.config/wecom/credentials.enc"
          chmod 600 "$HOME/.config/wecom/.encryption_key" "$HOME/.config/wecom/credentials.enc"
          python3 daily_report.py --date "$(TZ=Asia/Shanghai date -d 'yesterday' +%Y-%m-%d)" --push-cli --save-dir . || true

      - name: Persist daily report
        run: |
          git config user.name "marvis-bot"
          git config user.email "marvis-bot@users.noreply.github.com"
          git add daily_report_*.md
          if git diff --cached --quiet; then
            echo "no report, skip commit"
          else
            git commit -m "chore: daily report [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
